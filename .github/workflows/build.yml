name: Build patches

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android patch bundle
        run: ./gradlew :patches:checkLegacyAbi :patches:buildAndroid --no-daemon

      - name: Verify patch bundle
        run: |
          RVP="$(find patches/build/libs -maxdepth 1 -name '*.rvp' -print -quit)"
          test -n "$RVP"
          unzip -l "$RVP" | grep -q 'classes.dex'
          unzip -l "$RVP" | grep -q 'extensions/shared.rve'
          unzip -l "$RVP" | grep -q 'extensions/youtube.rve'
          unzip -l "$RVP" | grep -q 'OledProtectionPatchKt.class'

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: ekqimodyt-patches
          path: patches/build/libs/*.rvp
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" patches/build/libs/*.rvp --generate-notes --title "EkqiModYT $GITHUB_REF_NAME"
